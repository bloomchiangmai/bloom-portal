<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Parent Registration — Bloom Chiangmai</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#FDFAF5;color:#2C2C2A;width:100%;}
nav{display:flex;align-items:center;justify-content:center;padding:14px 20px;background:#FDFAF5;border-bottom:1px solid #E8E3D8;}
.logo{font-family:Georgia,serif;font-size:22px;font-weight:700;color:#2C2C2A;text-decoration:none;}

main{max-width:560px;margin:0 auto;padding:60px 24px 100px;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.8px;color:#534AB7;text-transform:uppercase;margin-bottom:14px;text-align:center;}
h1{font-family:Georgia,serif;font-size:30px;font-weight:700;color:#2C2C2A;margin-bottom:8px;text-align:center;}
.sub{font-size:15px;color:#5F5E5A;margin-bottom:36px;text-align:center;}

.card{background:#F7F3EC;border:1px solid #E8E3D8;border-radius:12px;padding:32px;margin-bottom:24px;}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.form-grid label{display:block;font-size:12px;font-weight:600;color:#5F5E5A;margin-bottom:6px;}
.form-grid input,.form-grid select{width:100%;padding:10px 12px;border:1px solid #E8E3D8;border-radius:8px;font-size:14px;background:#fff;}
.full-width{grid-column:1 / -1;}

.btn-primary{width:100%;padding:14px;border:none;border-radius:8px;background:#534AB7;color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
.btn-primary:hover{background:#443c99;}
.btn-primary:disabled{opacity:.6;cursor:default;}

.error-msg{color:#B23A3A;font-size:13px;margin-top:12px;text-align:center;}
.success-msg{color:#2E7D46;font-size:14px;margin-top:12px;text-align:center;}

.learner-badge{background:#E5E1F7;color:#534AB7;border-radius:8px;padding:14px 18px;margin-bottom:24px;font-size:14px;text-align:center;}
.learner-badge strong{font-family:Georgia,serif;font-size:17px;}

.section-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#534AB7;margin:20px 0 12px;border-bottom:1px solid #E8E3D8;padding-bottom:6px;}

@media (max-width: 640px) {
  .form-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<nav>
  <a href="https://learn2bloom.org" class="logo">Bloom Chiangmai</a>
</nav>

<main>
  <div class="eyebrow">Parent Portal</div>
  <h1>Create your account</h1>
  <p class="sub">Enter the Student ID and activation code given to you by the school.</p>

  <!-- Step 1: Verify code -->
  <div id="verifyStep" class="card">
    <div class="form-grid">
      <div>
        <label>Student ID</label>
        <input type="text" id="studentIdInput" placeholder="e.g. BMS26001" autocomplete="off">
      </div>
      <div>
        <label>Activation code</label>
        <input type="text" id="activationCodeInput" placeholder="e.g. F7K3P2" autocomplete="off">
      </div>
    </div>
    <button class="btn-primary" onclick="verifyCode()" id="verifyBtn">Continue</button>
    <div class="error-msg" id="verifyError"></div>
  </div>

  <!-- Step 2: Confirm details + set password -->
  <div id="registerStep" class="card" style="display:none;">
    <div class="learner-badge">Registering for <strong id="learnerName"></strong></div>

    <div class="section-label">Family details</div>
    <div class="form-grid">
      <div class="full-width">
        <label>Family name</label>
        <input type="text" id="regFamilyName">
      </div>
      <div>
        <label>Email (this will be your login)</label>
        <input type="email" id="regEmail">
      </div>
      <div>
        <label>Phone</label>
        <input type="text" id="regPhone">
      </div>
      <div>
        <label>Preferred contact method</label>
        <select id="regPreferredContact">
          <option value="">— Select —</option>
          <option>Line</option>
          <option>WhatsApp</option>
          <option>WeChat</option>
          <option>Email</option>
        </select>
      </div>
      <div>
        <label>Line / WeChat ID</label>
        <input type="text" id="regLineWechat">
      </div>
    </div>

    <div class="section-label">Emergency contact</div>
    <div class="form-grid">
      <div>
        <label>Name</label>
        <input type="text" id="regEmergencyName">
      </div>
      <div>
        <label>Relationship</label>
        <input type="text" id="regEmergencyRelationship">
      </div>
      <div class="full-width">
        <label>Number</label>
        <input type="text" id="regEmergencyNumber">
      </div>
    </div>

    <div class="section-label">Set your password</div>
    <div class="form-grid">
      <div>
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="At least 8 characters">
      </div>
      <div>
        <label>Confirm password</label>
        <input type="password" id="regPasswordConfirm">
      </div>
    </div>

    <button class="btn-primary" onclick="completeRegistration()" id="registerBtn" style="margin-top:8px;">Create account</button>
    <div class="error-msg" id="registerError"></div>
  </div>

  <!-- Step 3: Success -->
  <div id="successStep" class="card" style="display:none;text-align:center;">
    <div class="section-label" style="border:none;">Account created</div>
    <p style="font-size:15px;margin-bottom:16px;">You're all set. You can now sign in to access your family's Bloom Chiangmai account.</p>
  </div>

</main>

<script>
const SUPABASE_URL = 'https://ndlcfgkhxjoancdvmgmr.supabase.co';
let verifiedStudentId = null;
let verifiedActivationCode = null;

async function verifyCode(){
  const studentId = document.getElementById('studentIdInput').value.trim();
  const activationCode = document.getElementById('activationCodeInput').value.trim();
  const errEl = document.getElementById('verifyError');
  const btn = document.getElementById('verifyBtn');
  errEl.textContent = '';

  if(!studentId || !activationCode){
    errEl.textContent = 'Please enter both the Student ID and activation code.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Checking…';

  try {
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/verify-activation`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ student_id_code: studentId, activation_code: activationCode })
    });
    const data = await resp.json();

    if(!resp.ok){
      errEl.textContent = data.error || 'Something went wrong. Please try again.';
      btn.disabled = false;
      btn.textContent = 'Continue';
      return;
    }

    verifiedStudentId = studentId;
    verifiedActivationCode = activationCode;

    document.getElementById('learnerName').textContent = `${data.learner.first_name} ${data.learner.last_name}`;
    document.getElementById('regFamilyName').value = data.family.family_name || '';
    document.getElementById('regEmail').value = data.family.contact_email || '';
    document.getElementById('regPhone').value = data.family.contact_phone || '';
    document.getElementById('regPreferredContact').value = data.family.preferred_contact || '';
    document.getElementById('regLineWechat').value = data.family.line_wechat_id || '';
    document.getElementById('regEmergencyName').value = data.family.emergency_name || '';
    document.getElementById('regEmergencyRelationship').value = data.family.emergency_relationship || '';
    document.getElementById('regEmergencyNumber').value = data.family.emergency_number || '';

    document.getElementById('verifyStep').style.display = 'none';
    document.getElementById('registerStep').style.display = 'block';
  } catch (err) {
    errEl.textContent = 'Could not reach the server. Please check your connection and try again.';
    btn.disabled = false;
    btn.textContent = 'Continue';
  }
}

async function completeRegistration(){
  const errEl = document.getElementById('registerError');
  const btn = document.getElementById('registerBtn');
  errEl.textContent = '';

  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const passwordConfirm = document.getElementById('regPasswordConfirm').value;

  if(!email){
    errEl.textContent = 'Email is required.';
    return;
  }
  if(password.length < 8){
    errEl.textContent = 'Password must be at least 8 characters.';
    return;
  }
  if(password !== passwordConfirm){
    errEl.textContent = 'Passwords do not match.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Creating account…';

  try {
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/complete-registration`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        student_id_code: verifiedStudentId,
        activation_code: verifiedActivationCode,
        password: password,
        family_name: document.getElementById('regFamilyName').value.trim(),
        contact_email: email,
        contact_phone: document.getElementById('regPhone').value.trim(),
        preferred_contact: document.getElementById('regPreferredContact').value,
        line_wechat_id: document.getElementById('regLineWechat').value.trim(),
        emergency_name: document.getElementById('regEmergencyName').value.trim(),
        emergency_relationship: document.getElementById('regEmergencyRelationship').value.trim(),
        emergency_number: document.getElementById('regEmergencyNumber').value.trim()
      })
    });
    const data = await resp.json();

    if(!resp.ok){
      errEl.textContent = data.error || 'Something went wrong. Please try again.';
      btn.disabled = false;
      btn.textContent = 'Create account';
      return;
    }

    document.getElementById('registerStep').style.display = 'none';
    document.getElementById('successStep').style.display = 'block';
  } catch (err) {
    errEl.textContent = 'Could not reach the server. Please check your connection and try again.';
    btn.disabled = false;
    btn.textContent = 'Create account';
  }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Reset Password — Bloom Chiangmai Parent Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#FDFAF5;color:#2C2C2A;width:100%;}
nav{display:flex;align-items:center;justify-content:center;padding:14px 20px;background:#FDFAF5;border-bottom:1px solid #E8E3D8;}
.logo{font-family:Georgia,serif;font-size:22px;font-weight:700;color:#2C2C2A;text-decoration:none;}

main{max-width:420px;margin:0 auto;padding:80px 24px 100px;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.8px;color:#534AB7;text-transform:uppercase;margin-bottom:14px;text-align:center;}
h1{font-family:Georgia,serif;font-size:30px;font-weight:700;color:#2C2C2A;margin-bottom:8px;text-align:center;}
.sub{font-size:15px;color:#5F5E5A;margin-bottom:36px;text-align:center;}

.card{background:#F7F3EC;border:1px solid #E8E3D8;border-radius:12px;padding:32px;}
label{display:block;font-size:12px;font-weight:600;color:#5F5E5A;margin-bottom:6px;}
input{width:100%;padding:12px 14px;border:1px solid #E8E3D8;border-radius:8px;font-size:15px;margin-bottom:16px;background:#fff;}

.btn-primary{width:100%;padding:14px;border:none;border-radius:8px;background:#534AB7;color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
.btn-primary:hover{background:#443c99;}
.btn-primary:disabled{opacity:.6;cursor:default;}

.error-msg{color:#B23A3A;font-size:13px;margin-top:12px;text-align:center;}
.success-msg{color:#2E7D46;font-size:14px;margin-top:12px;text-align:center;}
.helper-link{display:block;text-align:center;margin-top:20px;font-size:13px;color:#534AB7;text-decoration:none;}
</style>
</head>
<body>

<nav>
  <a href="https://learn2bloom.org" class="logo">Bloom Chiangmai</a>
</nav>

<main>
  <div class="eyebrow">Parent Portal</div>
  <h1>Set a new password</h1>
  <p class="sub" id="subText">Checking your reset link…</p>

  <div class="card" id="formCard" style="display:none;">
    <label>New password</label>
    <input type="password" id="newPassword" placeholder="At least 8 characters">
    <label>Confirm password</label>
    <input type="password" id="confirmPassword">
    <button class="btn-primary" onclick="submitNewPassword()" id="submitBtn">Set new password</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="card" id="invalidCard" style="display:none;text-align:center;">
    <p style="font-size:15px;">This reset link is invalid or has expired.</p>
    <a href="login.html" class="helper-link" style="margin-top:16px;">Back to sign in</a>
  </div>

  <div class="card" id="successCard" style="display:none;text-align:center;">
    <p style="font-size:15px;margin-bottom:16px;">Your password has been updated.</p>
    <a href="login.html" class="btn-primary" style="display:inline-block;text-decoration:none;">Sign in</a>
  </div>
</main>

<footer style="background:#F7F3EC;padding:22px max(48px, calc((100% - 1200px) / 2 + 48px)) 40px;border-top:1px solid #E8E3D8;">
  <p style="text-align:center;font-size:12px;color:#888780;">© 2026 Bloom Chiangmai Learning Hub. All rights reserved.</p>
</footer>

<script>
const SUPABASE_URL = 'https://ndlcfgkhxjoancdvmgmr.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kbGNmZ2toeGpvYW5jZHZtZ21yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDYwODUsImV4cCI6MjA5Nzk4MjA4NX0.q0F6_ej0CTneazs6ey7mR3HOsGpqrU0BLe8Y-JHatu8';

const bloomHubCookieStorage = {
  getItem(key){
    const m = document.cookie.match('(^|; )' + key.replace(/[-[\]{}()*+?.,\\^$|#\s]/g,'\\$&') + '=([^;]*)');
    return m ? decodeURIComponent(m[2]) : null;
  },
  setItem(key, value){
    let cookie = key + '=' + encodeURIComponent(value) + '; Max-Age=' + (60*60*24*30) + '; Path=/; SameSite=Lax; Secure';
    if(location.hostname.endsWith('learn2bloom.org')) cookie += '; Domain=.learn2bloom.org';
    document.cookie = cookie;
  },
  removeItem(key){
    let cookie = key + '=; Max-Age=0; Path=/; SameSite=Lax; Secure';
    if(location.hostname.endsWith('learn2bloom.org')) cookie += '; Domain=.learn2bloom.org';
    document.cookie = cookie;
  }
};

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    storage: bloomHubCookieStorage,
    storageKey: 'bloom-hub-auth',
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true
  }
});

let recoveryReady = false;

sb.auth.onAuthStateChange((event, session) => {
  if(event === 'PASSWORD_RECOVERY'){
    recoveryReady = true;
    document.getElementById('subText').textContent = 'Enter a new password for your account.';
    document.getElementById('formCard').style.display = 'block';
  }
});

// If no recovery event fires shortly after load, the link was invalid/expired
setTimeout(() => {
  if(!recoveryReady){
    document.getElementById('subText').textContent = '';
    document.getElementById('invalidCard').style.display = 'block';
  }
}, 3000);

async function submitNewPassword(){
  const pass = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  const errEl = document.getElementById('errorMsg');
  const btn = document.getElementById('submitBtn');
  errEl.textContent = '';

  if(pass.length < 8){
    errEl.textContent = 'Password must be at least 8 characters.';
    return;
  }
  if(pass !== confirm){
    errEl.textContent = 'Passwords do not match.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Saving…';

  const { error } = await sb.auth.updateUser({ password: pass });

  if(error){
    errEl.textContent = error.message || 'Could not update password. Please try again.';
    btn.disabled = false;
    btn.textContent = 'Set new password';
    return;
  }

  document.getElementById('formCard').style.display = 'none';
  document.getElementById('successCard').style.display = 'block';
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sign In — Bloom Chiangmai Parent Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#FDFAF5;color:#2C2C2A;width:100%;}
nav{display:flex;align-items:center;justify-content:center;padding:14px 20px;background:#FDFAF5;border-bottom:1px solid #E8E3D8;}
.logo{font-family:Georgia,serif;font-size:22px;font-weight:700;color:#2C2C2A;text-decoration:none;}

main{max-width:420px;margin:0 auto;padding:80px 24px 100px;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.8px;color:#534AB7;text-transform:uppercase;margin-bottom:14px;text-align:center;}
h1{font-family:Georgia,serif;font-size:30px;font-weight:700;color:#2C2C2A;margin-bottom:8px;text-align:center;}
.sub{font-size:15px;color:#5F5E5A;margin-bottom:36px;text-align:center;}

.card{background:#F7F3EC;border:1px solid #E8E3D8;border-radius:12px;padding:32px;}
label{display:block;font-size:12px;font-weight:600;color:#5F5E5A;margin-bottom:6px;}
input{width:100%;padding:12px 14px;border:1px solid #E8E3D8;border-radius:8px;font-size:15px;margin-bottom:16px;background:#fff;}

.btn-primary{width:100%;padding:14px;border:none;border-radius:8px;background:#534AB7;color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
.btn-primary:hover{background:#443c99;}
.btn-primary:disabled{opacity:.6;cursor:default;}

.error-msg{color:#B23A3A;font-size:13px;margin-top:12px;text-align:center;}
.helper-link{display:block;text-align:center;margin-top:20px;font-size:13px;color:#534AB7;text-decoration:none;}
</style>
</head>
<body>

<nav>
  <a href="https://learn2bloom.org" class="logo">Bloom Chiangmai</a>
</nav>

<main>
  <div class="eyebrow">Parent Portal</div>
  <h1>Sign in</h1>
  <p class="sub">Access your family's Bloom Chiangmai account.</p>

  <div class="card">
    <label>Student ID</label>
    <input type="text" id="loginStudentId" placeholder="e.g. BMS26001">
    <div id="passwordFieldWrap">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Your password">
    </div>
    <button class="btn-primary" onclick="doLogin()" id="loginBtn">Sign in</button>
    <div style="text-align:right;margin-top:14px;margin-bottom:8px;">
      <a href="javascript:void(0)" onclick="toggleForgotPassword()" id="forgotToggle" style="font-size:13px;color:#534AB7;text-decoration:none;">Forgot password?</a>
    </div>
    <div class="error-msg" id="loginError"></div>
    <div class="success-msg" id="resetSuccessMsg" style="display:none;"></div>
  </div>

  <a href="index.html" class="helper-link">Need to activate a new Student ID? Register here</a>
</main>

<footer style="background:#F7F3EC;padding:22px max(48px, calc((100% - 1200px) / 2 + 48px)) 40px;border-top:1px solid #E8E3D8;">
  <p style="text-align:center;font-size:12px;color:#888780;">© 2026 Bloom Chiangmai Learning Hub. All rights reserved.</p>
</footer>

<script>
const SUPABASE_URL = 'https://ndlcfgkhxjoancdvmgmr.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kbGNmZ2toeGpvYW5jZHZtZ21yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDYwODUsImV4cCI6MjA5Nzk4MjA4NX0.q0F6_ej0CTneazs6ey7mR3HOsGpqrU0BLe8Y-JHatu8';

// Shared cross-subdomain session storage for Bloom Space Hub (Bloombrary + Calendar + Portal).
// Stores the Supabase session in a cookie scoped to .learn2bloom.org instead of the
// default localStorage, so signing in here is also recognized on the other Bloom tools.
// Must match bloom-library and bloom-calendar's implementation exactly (same storageKey,
// same cookie format) or sessions won't be recognized as the same across sites.
const bloomHubCookieStorage = {
  getItem(key){
    const m = document.cookie.match('(^|; )' + key.replace(/[-[\]{}()*+?.,\\^$|#\s]/g,'\\$&') + '=([^;]*)');
    return m ? decodeURIComponent(m[2]) : null;
  },
  setItem(key, value){
    let cookie = key + '=' + encodeURIComponent(value) + '; Max-Age=' + (60*60*24*30) + '; Path=/; SameSite=Lax; Secure';
    if(location.hostname.endsWith('learn2bloom.org')) cookie += '; Domain=.learn2bloom.org';
    document.cookie = cookie;
  },
  removeItem(key){
    let cookie = key + '=; Max-Age=0; Path=/; SameSite=Lax; Secure';
    if(location.hostname.endsWith('learn2bloom.org')) cookie += '; Domain=.learn2bloom.org';
    document.cookie = cookie;
  }
};

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    storage: bloomHubCookieStorage,
    storageKey: 'bloom-hub-auth',
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true
  }
});

let inForgotMode = false;

function toggleForgotPassword(){
  inForgotMode = !inForgotMode;
  const passWrap = document.getElementById('passwordFieldWrap');
  const btn = document.getElementById('loginBtn');
  const toggle = document.getElementById('forgotToggle');
  const errEl = document.getElementById('loginError');
  const successEl = document.getElementById('resetSuccessMsg');

  errEl.textContent = '';
  successEl.style.display = 'none';

  if(inForgotMode){
    passWrap.style.display = 'none';
    btn.textContent = 'Send reset link';
    btn.onclick = sendResetLink;
    toggle.textContent = 'Back to sign in';
  } else {
    passWrap.style.display = 'block';
    btn.textContent = 'Sign in';
    btn.onclick = doLogin;
    toggle.textContent = 'Forgot password?';
  }
}

async function resolveEmailFromStudentId(studentId){
  const resp = await fetch(`${SUPABASE_URL}/functions/v1/resolve-login-identity`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ student_id_code: studentId })
  });
  const data = await resp.json();
  if(!resp.ok){
    throw new Error(data.error || 'Could not find an account for that Student ID.');
  }
  return data.email;
}

async function sendResetLink(){
  const studentId = document.getElementById('loginStudentId').value.trim();
  const errEl = document.getElementById('loginError');
  const successEl = document.getElementById('resetSuccessMsg');
  const btn = document.getElementById('loginBtn');
  errEl.textContent = '';
  successEl.style.display = 'none';

  if(!studentId){
    errEl.textContent = 'Please enter your Student ID.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Sending…';

  try {
    const email = await resolveEmailFromStudentId(studentId);

    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html'
    });

    btn.disabled = false;
    btn.textContent = 'Send reset link';

    if(error){
      errEl.textContent = error.message || 'Could not send reset email. Please try again.';
      return;
    }

    successEl.textContent = 'A reset link has been sent to the contact email on file for this account.';
    successEl.style.display = 'block';
  } catch(err){
    btn.disabled = false;
    btn.textContent = 'Send reset link';
    errEl.textContent = err.message || 'Something went wrong. Please try again.';
  }
}

function getRedirectTarget(){
  const params = new URLSearchParams(window.location.search);
  const redirect = params.get('redirect');
  if(!redirect || redirect === 'login.html') return 'dashboard.html';
  try {
    const url = new URL(redirect, window.location.origin);
    if(url.hostname === 'learn2bloom.org' || url.hostname.endsWith('.learn2bloom.org')){
      return url.href;
    }
  } catch {}
  return 'dashboard.html';
}

async function checkExistingSession(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    window.location.href = getRedirectTarget();
  }
}

async function doLogin(){
  const studentId = document.getElementById('loginStudentId').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errEl.textContent = '';

  if(!studentId || !password){
    errEl.textContent = 'Please enter your Student ID and password.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {
    const email = await resolveEmailFromStudentId(studentId);
    const { error } = await sb.auth.signInWithPassword({ email, password });

    if(error){
      errEl.textContent = 'Incorrect Student ID or password. Please try again.';
      btn.disabled = false;
      btn.textContent = 'Sign in';
      return;
    }

    window.location.href = getRedirectTarget();
  } catch(err){
    errEl.textContent = err.message || 'Incorrect Student ID or password. Please try again.';
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
}

checkExistingSession();
</script>

</body>
</html>
